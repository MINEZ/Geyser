# MINEZ：本 fork 的构建。服务器上只部署 Geyser-Velocity，因此只构建它（不构建其他平台、javadoc 与源码包），测试另起一个作业并行运行，
# jar 不必等测试跑完。上游的构建、Maven 发布与预览版都依赖 GeyserMC 的私有密钥与下载站，本 fork 中已去掉。
# 第三方 action 固定到提交：标签可以被移动，而这里构建出的 jar 会部署到服务器上。
name: Build

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.idea/copyright/*.xml'
      - '.gitignore'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'

permissions:
  contents: read

# 同一分支上有新的推送时，取消还在运行的旧构建。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  velocity:
    name: Geyser-Velocity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # 语言文件与映射数据在子模块中，缺了它们 Geyser 无法启动。
          submodules: recursive
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build Geyser-Velocity
        run: |
          chmod +x ./gradlew
          ./gradlew :velocity:shadowJar --stacktrace
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload Geyser-Velocity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Geyser-Velocity
          path: bootstrap/velocity/build/libs/Geyser-Velocity-*.jar
          if-no-files-found: error

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Test-Reports
          path: core/build/reports/tests/test
          if-no-files-found: ignore
